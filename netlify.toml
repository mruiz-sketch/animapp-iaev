[build]
  publish = "."

# La apiKey de Firebase (AIza…) en firebase-config.js es pública por diseño (la seguridad está en las
# reglas de Firestore). Se excluye ese archivo del escáner de secretos para que no bloquee la publicación.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_PATHS = "firebase-config.js"
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyAo6ZfqsRJN4dDHsFj1eJgHc-6b6VDz5LQ"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

# No publicar el código de las funciones ni las dependencias como archivos
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true

[[headers]]
  for = "/videos*/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/posters/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
