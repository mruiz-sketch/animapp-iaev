let pid=null,pc=null,ch=null,mySlot=-1,ST=null,lastHtml='',closing=false,tries=0,wake=null,awSeen=-1;
const top_=$('#top');
async function sig(body){const r=await fetch(SIG,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
async function sigGet(q){const r=await fetch(SIG+'?'+new URLSearchParams(q),{cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
function iceDone(p,ms=3000){return new Promise(r=>{if(p.iceGatheringState==='complete')return r();const t=setTimeout(r,ms);p.addEventListener('icegatheringstatechange',()=>{if(p.iceGatheringState==='complete'){clearTimeout(t);r()}})})}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
async function keepAwake(){try{if('wakeLock' in navigator&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){keepAwake();if(!ch&&pid&&!closing)connect()}});
function setTop(h){if(h!==lastHtml){lastHtml=h;top_.innerHTML=h}}
function joinScreen(err){$('#bigwrap').style.display='none';
  setTop(`<h1>COYOTE PARTY</h1><div><span class="tag">📱 CONTROL</span></div>${err?`<p class="err">${esc(err)}</p>`:''}
    ${CODE?'':'<p>Código de sala (está en la pantalla de la PC):</p><input id="cd" maxlength="6" placeholder="ABC123" style="text-transform:uppercase;letter-spacing:6px">'}
    <p>Tu nombre:</p><input id="nm" maxlength="12" placeholder="Tu nombre" value="${esc(LS.get('cp_name')||'')}"><button class="go" id="cn">CONECTAR ▶</button><p class="sm">Tu celular debe estar en la misma red wifi que la computadora.</p>`);
  $('#cn').onclick=()=>{audio();keepAwake();if(!CODE){const c=($('#cd').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length!==6){vib(80);return}CODE=c}
    const n=cleanName($('#nm').value);if(!n){$('#nm').focus();vib(80);return}LS.set('cp_name',n);G.name=n;
    pid=LS.get('cp_pid_'+CODE)||Array.from({length:12},()=>'abcdefghijkmnpqrstuvwxyz23456789'[Math.floor(Math.random()*32)]).join('');LS.set('cp_pid_'+CODE,pid);connect()}}
function status(t,btn){$('#bigwrap').style.display='none';setTop(`<h2>COYOTE PARTY</h2><p class="wait">${t}</p>${btn?'<button class="alt" id="rt">↻ REINTENTAR</button>':''}`);if(btn)$('#rt').onclick=()=>{tries=0;connect()}}
async function connect(){closing=false;try{ch&&ch.close()}catch(e){}try{pc&&pc.close()}catch(e){}ch=null;tries++;
  status(tries>1?'Reconectando…':'Conectando con la PC…');
  try{pc=new RTCPeerConnection(ICE);const mine=pc;const c=pc.createDataChannel('cp',{ordered:true});
    c.onopen=()=>{if(pc!==mine)return;ch=c;tries=0;vib([30,40,30]);c.send(JSON.stringify({t:'n',v:G.name}));render()};
    c.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}if(m.t==='s'){ST=m.S;render()}};
    c.onclose=()=>{if(pc!==mine)return;ch=null;if(!closing)setTimeout(()=>{if(!ch&&pc===mine)connect()},1500)};
    const of=await pc.createOffer();await pc.setLocalDescription(of);await iceDone(pc);
    await sig({op:'offer',code:CODE,pid,name:G.name,sdp:pc.localDescription.sdp});
    let ans=null;for(let k=0;k<45&&!ans;k++){await sleep(800);if(pc!==mine)return;const j=await sigGet({op:'poll',code:CODE,pid});
      if(j.err==='full'){closing=true;joinScreen('Esa sala ya está completa o la partida ya empezó.');return}if(j.answer){ans=j;break}}
    if(!ans)throw new Error('La PC no respondió. ¿Sigue abierta la pantalla del QR?');
    mySlot=ans.slot;await pc.setRemoteDescription({type:'answer',sdp:ans.answer});
    await sleep(12000);if(pc===mine&&!ch){throw new Error('No se pudo conectar directo con la PC. Verifica que ambos estén en la misma red wifi (algunas redes escolares bloquean la conexión entre dispositivos; un hotspot de celular sí funciona).')}
  }catch(e){if(/no encontrada/.test(e.message)){closing=true;joinScreen('No encontramos la sala '+CODE+'. Escanea de nuevo el QR de la PC.');return}status(esc(e.message),true)}}
function send(o){if(ch&&ch.readyState==='open')try{ch.send(JSON.stringify(o))}catch(e){}}
function act(k,v){send({t:'a',k,v});vib(12);SFX.blip()}
// Botón grande (minijuegos)
const big=$('#big');let held=false;
big.addEventListener('pointerdown',e=>{e.preventDefault();try{big.setPointerCapture(e.pointerId)}catch(x){}if(!held){held=true;big.classList.add('on');send({t:'d'});vib(8)}});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>big.addEventListener(ev,()=>{if(held){held=false;big.classList.remove('on');send({t:'u'})}}));
big.addEventListener('contextmenu',e=>e.preventDefault());
top_.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;let v=b.dataset.v;if(v!==undefined)v=(a==='ans')?v==='1':+v;act(a,v)});
function render(){if(!ST||!ch)return;const S=ST;mySlot=S.pl.findIndex(p=>p.pe===pid);if(mySlot<0){status('Esperando un lugar en la partida…');return}
  const me=mySlot,p=S.pl[me],J1=me===0,col=PCOL[me];document.documentElement.style.setProperty('--pc',col);
  $('#hj').textContent='J'+(me+1);$('#hn').textContent=p.n;$('#hs').textContent=['board','round','vote','rank','final','bintro'].includes(S.ph)?`🏆${p.st} 🪙${p.co}`:'';
  const W=t=>`<div class="wait">${t}</div>`,dlg=(J1&&S.dlg)?`<div class="row"><button data-a="dlg">▶ SIGUIENTE</button><button data-a="skip" class="alt">⏭ SALTAR</button></div>`:'';
  let h='',bigOn=false,bigL='';
  switch(S.ph){
    case 'lobby':h=`<div class="ok" style="font-size:16px">✔ ¡CONECTADO!</div><p>Eres <b style="color:${col}">J${me+1}</b>. Mira la pantalla de la PC.</p>`+(J1?'<button class="go" data-a="next">▶ COMENZAR</button><p class="sm">Como J1, tú inicias la partida cuando todos estén conectados.</p>':W('J1 iniciará la partida…'));break;
    case 'intro':h=W('📺 Timo y Maya presentan el show…')+dlg;break;
    case 'cos':if(S.cosTurn===me){const c=COSTUMES[S.cosSel];h=`<h2>¡ELIGE TU DISFRAZ!</h2><div class="pickrow"><button class="arrow" data-a="cosmv" data-v="-1">◀</button><div class="pickname">${esc(c.n)}<small>${c.cat} · ${esc(c.src)}</small></div><button class="arrow" data-a="cosmv" data-v="1">▶</button></div><button class="go" data-a="cos">✔ ¡ESTE!</button><p class="sm">Mira cómo se ve en la pantalla.</p>`}
      else if(p.c>=0)h=`<p>Tu disfraz:</p><div class="pickname">${esc(COSTUMES[p.c].n)}</div>`+W('Esperando a los demás…');else h=W(`Está eligiendo J${S.cosTurn+1}…<br>¡ya casi es tu turno!`);h+=dlg;break;
    case 'cast':h=`<p>Eres</p><div class="pickname">${esc(COSTUMES[p.c].n)}</div>`+(J1?'<button class="go" data-a="next">ELEGIR TABLERO ▶</button>':W('Mira la pantalla 📺'))+dlg;break;
    case 'bsel':if(J1){const B=BOARDS[S.bsel];h=`<h2>ELIGE EL TABLERO</h2><div class="pickrow"><button class="arrow" data-a="bsel" data-v="${S.bsel-1}">◀</button><div class="pickname">${B.short}<small>⏱ ${B.min} min · ${B.rounds} rondas</small></div><button class="arrow" data-a="bsel" data-v="${S.bsel+1}">▶</button></div><button class="go" data-a="bpick">✔ ¡A JUGAR!</button>`}else h=W('J1 está eligiendo el tablero…');h+=dlg;break;
    case 'bintro':case 'round':h=W(S.ph==='round'?`RONDA ${S.rd} DE ${BOARDS[S.bi].rounds}`:'📺 Mira el tablero…')+dlg;break;
    case 'vote':{const V=S.vote,mv=V.v[me];h=`<h2>VOTA EL MINIJUEGO</h2>`+V.o.map((id,k)=>{const m=MINIGAMES[id];return`<button class="vote ${mv===k?'sel':''} ${V.w===k?'go':''}" data-a="vote" data-v="${k}" ${mv>=0||V.w>=0?'disabled':''}>${k+1}. ${esc(m.name)}<small>${THEMES[m.theme].n} · ${MECH_INFO[m.mech].c}</small></button>`}).join('')+(V.w>=0?`<div class="ok">¡GANÓ ${esc(MINIGAMES[V.o[V.w]].name)}!</div>`:mv>=0?W('Esperando los demás votos…'):'');break}
    case 'preview':{const m=MINIGAMES[S.mg.id];h=`<h2>${esc(m.name)}</h2><p>${esc(MECH_INFO[m.mech].r)}</p><p class="sm">🎮 ${MECH_INFO[m.mech].c} con el botón grande</p>`+dlg;break}
    case 'practice':{bigOn=true;bigL='PRÁCTICA';const m=MINIGAMES[S.mg.id];h=`<h3>${esc(m.name)}</h3><p class="sm">${MECH_INFO[m.mech].c}</p>`+(S.ready[me]?'<div class="ok">✔ ¡LISTO! Esperando a los demás…</div>':'<button class="alt" data-a="ready">✔ ¡ESTOY LISTO!</button>');break}
    case 'play':{bigOn=true;bigL='¡VA EN SERIO!';const m=MINIGAMES[S.mg.id];h=`<h3>${esc(m.name)}</h3><p class="sm">${MECH_INFO[m.mech].c}</p>`;break}
    case 'rank':{const k=S.rank.findIndex(r=>r[0]===me);h=`<p>Tu lugar</p><div class="place">${k+1}°</div><p>${esc(S.rank[k][1])} · +${S.rank[k][2]} 🪙</p>`+(J1?'<button class="go" data-a="next">AL TABLERO ▶</button>':W('Mira los resultados 📺'));break}
    case 'board':{const aw=S.aw;if(aw&&aw.s===me){if(aw.id!==awSeen){awSeen=aw.id;vib([60,40,60])}
        if(aw.k==='roll')h=`<h2>¡TU TURNO!</h2><button class="dice" data-a="roll" data-v="1">🎲<br>¡TIRAR!</button>`;
        else{const q=aw.d;h=`<h2>${esc(q.t)}</h2><p>${esc(q.h)}</p>${q.y?`<button class="go" data-a="ans" data-v="1">${esc(q.y)}</button>`:''}<button class="alt" data-a="ans" data-v="0">${esc(q.n)}</button>`}}
      else{h=(S.dice&&S.dice.s!==me)?`<div class="dicev">${S.dice.r?'🎲':S.dice.v}</div>`:'';h+=W(S.turn>=0?`Turno de ${esc(S.pl[S.turn].n)}`:'Mira el tablero 📺');if(S.dice&&S.dice.s===me&&!S.dice.r)h=`<p>Sacaste</p><div class="dicev">${S.dice.v}</div>`}
      h+=dlg;break}
    case 'final':{const k=S.order.indexOf(me);h=`<h1>¡FIN DEL SHOW!</h1><p>Quedaste en</p><div class="place">${k+1}°</div><p>🏆 ${p.st} Coyoscar${p.st===1?'':'es'} · 🪙 ${p.co}</p>`+(J1?'<button class="go" data-a="again">↻ JUGAR OTRA VEZ</button>':'')+dlg;break}
    default:h=W('Mira la pantalla 📺')+dlg}
  setTop(h);$('#bigwrap').style.display=bigOn?'block':'none';$('#bigl').textContent=bigL;if(!bigOn&&held){held=false;big.classList.remove('on');send({t:'u'})}}
if(!window.RTCPeerConnection)joinScreen('Este navegador no permite la conexión. Usa Chrome o Safari actualizados.');else joinScreen();

</script>
</body>
</html>
