<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coyote Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--ink:#fff7e6;--bg:#1a0f2e;--gold:#ffd84a;--green:#16703a;--pink:#ff4fa3;--cyan:#46e0ff;--dk:#2a0f3a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#120a22;color:var(--ink);font-family:'VT323',monospace;font-size:22px;overflow:hidden;user-select:none;-webkit-user-select:none}
#c3d{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;overflow:auto;pointer-events:none}
#scr>*{pointer-events:auto}
#scr.dim{background:#120a22b0}
h1,h2,h3,.px{font-family:'Press Start 2P',monospace;font-weight:normal;margin:.3em 0;line-height:1.35}
h1{font-size:clamp(22px,5vw,54px);color:var(--gold);text-shadow:4px 4px 0 #b3361f,8px 8px 0 var(--dk)}
h2{font-size:clamp(13px,2.2vw,24px);color:var(--gold);text-shadow:3px 3px 0 var(--dk)}
h3{font-size:clamp(10px,1.3vw,14px)}
.btn{font-family:'Press Start 2P',monospace;font-size:clamp(10px,1.2vw,14px);background:var(--gold);color:var(--dk);border:0;padding:14px 18px;cursor:pointer;box-shadow:0 4px 0 #a8740f,0 0 0 4px var(--dk),0 8px 0 4px var(--dk);margin:10px;position:relative}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(3px)}
.btn.alt{background:var(--cyan);box-shadow:0 4px 0 #1b7f99,0 0 0 4px var(--dk),0 8px 0 4px var(--dk)}
.btn.pink{background:var(--pink);color:#fff;box-shadow:0 4px 0 #9a1f5c,0 0 0 4px var(--dk),0 8px 0 4px var(--dk)}
.btn.sm{padding:8px 10px;font-size:10px;margin:6px}
.btn:disabled{opacity:.4;cursor:default;filter:grayscale(1)}
.panel{background:#2a1748ee;border:4px solid var(--ink);box-shadow:0 0 0 4px var(--dk),8px 8px 0 4px #0008;padding:16px;max-width:1000px;width:100%}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.hidden{display:none!important}
.small{font-size:19px;opacity:.88}
.tag{font-family:'Press Start 2P';font-size:9px;padding:4px 6px;background:var(--cyan);color:var(--dk);display:inline-block;margin:2px}
.tag.g{background:var(--gold)}.tag.p{background:var(--pink);color:#fff}
.keycap{display:inline-block;font-family:'Press Start 2P';font-size:10px;background:var(--ink);color:var(--dk);padding:4px 6px;border-bottom:3px solid #999;margin:0 2px}
input.tx{font-family:'Press Start 2P';font-size:13px;padding:10px;background:var(--ink);border:3px solid var(--dk);color:var(--dk);width:240px;text-align:center;text-transform:none}
input.code{text-transform:uppercase;letter-spacing:6px;font-size:20px}
.code-big{font-family:'Press Start 2P';font-size:clamp(28px,6vw,64px);color:var(--gold);letter-spacing:10px;text-shadow:4px 4px 0 #b3361f;background:#000a;padding:10px 24px;border:4px dashed var(--gold);display:inline-block}
/* dialog */
#dlg{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(920px,96vw);background:var(--ink);color:var(--dk);border:4px solid var(--dk);box-shadow:0 0 0 4px var(--ink),0 0 0 8px var(--dk);display:flex;gap:14px;padding:10px;z-index:40;cursor:pointer;min-height:118px}
#dlgFace{width:96px;height:96px;flex:none;border:3px solid var(--dk);background:#2a1748}
#dlgFace.talk{animation:talk .18s steps(2) infinite}
@keyframes talk{50%{transform:translateY(-3px)}}
#dlgName{font-family:'Press Start 2P';font-size:12px;color:#fff;background:var(--green);display:inline-block;padding:5px 8px;margin-bottom:6px}
#dlgName.maya{background:#c2387d}
#dlgText{font-size:clamp(20px,2.1vw,26px);line-height:1.15}
#dlgNext{position:absolute;right:12px;bottom:8px;font-family:'Press Start 2P';font-size:12px;animation:blink 1s steps(2) infinite}
#dlgSkip{position:absolute;right:8px;top:-36px;font-size:9px;padding:6px 8px;margin:0}
@keyframes blink{50%{opacity:0}}
/* carousel controls */
.carnav{position:fixed;left:0;right:0;bottom:16px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.carnav>*{pointer-events:auto}
.arrow{font-family:'Press Start 2P';font-size:26px;background:#2a1748cc;border:4px solid var(--ink);color:var(--gold);cursor:pointer;padding:10px 14px;box-shadow:0 0 0 3px var(--dk)}
.info{background:#2a1748ee;border:4px solid var(--ink);box-shadow:0 0 0 4px var(--dk);padding:10px 16px;max-width:780px;text-align:center}
/* HUD */
#hud{position:fixed;top:8px;left:0;right:0;display:flex;gap:8px;z-index:20;flex-wrap:wrap;justify-content:center;pointer-events:none}
.pc{background:#2a1748e8;border:3px solid var(--ink);padding:3px 8px 3px 3px;display:flex;gap:6px;align-items:center;min-width:160px;box-shadow:0 0 0 3px var(--dk)}
.pc.turn{border-color:var(--gold);box-shadow:0 0 0 3px var(--dk),0 0 18px var(--gold)}
.pc.me .nm:after{content:" (TÚ)";color:#fff}
.pc>img{width:46px;height:46px}
.pc .nm{font-family:'Press Start 2P';font-size:8px}
.pc .st{font-size:21px;line-height:1}
.pc .st img{width:16px;height:16px;vertical-align:middle}
.pc .lv{font-size:15px;opacity:.75}
#rbar{position:fixed;left:10px;bottom:10px;z-index:20;font-family:'Press Start 2P';font-size:10px;background:#2a1748e8;border:3px solid var(--ink);padding:8px;line-height:1.7}
#tools{position:fixed;right:10px;bottom:10px;z-index:45;display:flex;gap:4px}
#netb{position:fixed;right:10px;top:10px;z-index:45;font-family:'Press Start 2P';font-size:9px;background:#000a;padding:6px 8px;border:2px solid var(--cyan)}
#msg{position:fixed;left:50%;top:92px;transform:translateX(-50%);z-index:25;font-family:'Press Start 2P';font-size:clamp(10px,1.3vw,14px);background:#2a0f3ae8;border:3px solid var(--gold);padding:10px 14px;text-align:center;max-width:90vw;line-height:1.6}
#dice{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:30;width:140px;height:140px;background:var(--ink);color:var(--dk);border:6px solid var(--dk);box-shadow:inset -12px -12px 0 #d9c9a8,0 0 0 6px var(--ink),0 0 0 12px var(--dk);font-family:'Press Start 2P';font-size:56px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#dice.roll{animation:wob .25s infinite}
#dice.done{animation:pop .4s}
@keyframes wob{25%{transform:translate(-50%,-50%) rotate(-8deg)}75%{transform:translate(-50%,-50%) rotate(8deg)}}
@keyframes pop{50%{transform:translate(-50%,-50%) scale(1.25)}}
#diceTip{position:fixed;left:50%;top:calc(44% + 100px);transform:translateX(-50%);z-index:30;font-family:'Press Start 2P';font-size:11px;background:var(--dk);padding:8px 10px;border:3px solid var(--gold);text-align:center}
#modal{position:fixed;inset:0;z-index:50;background:#0008;display:flex;align-items:center;justify-content:center}
#modal .panel{max-width:560px;text-align:center}
#modal img{width:72px;height:72px}
#pad{position:fixed;right:18px;bottom:70px;z-index:35}
#pad button{font-family:'Press Start 2P';font-size:12px;width:120px;height:120px;border-radius:50%;border:6px solid var(--dk);color:var(--dk);cursor:pointer;box-shadow:0 8px 0 #0008;touch-action:none;background:var(--pink)}
#pad button.on{transform:translateY(5px);box-shadow:0 3px 0 #0008;filter:brightness(1.25)}
/* minigame */
#mgc{width:min(94vw,calc((100vh - 200px)*1.7778));aspect-ratio:16/9;border:4px solid var(--ink);box-shadow:0 0 0 4px var(--dk),0 12px 30px #000;background:#000;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.vote{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:min(1120px,96vw)}
@media (max-width:820px){.vote{grid-template-columns:repeat(2,1fr)}}
.vc{background:#2a1748;border:4px solid var(--ink);padding:8px;cursor:pointer;position:relative;box-shadow:0 0 0 3px var(--dk)}
.vc:hover{border-color:var(--gold)}
.vc.mine{border-color:var(--cyan)}
.vc.win{border-color:var(--gold);box-shadow:0 0 0 3px var(--dk),0 0 28px var(--gold)}
.vc canvas{width:100%;aspect-ratio:16/9;display:block;image-rendering:pixelated}
.vc .vn{font-family:'Press Start 2P';font-size:10px;margin:8px 0 4px;line-height:1.4;color:var(--gold)}
.vc .votes{display:flex;gap:3px;min-height:30px;flex-wrap:wrap}
.vc .votes img{width:28px;height:28px}
.rk{display:flex;align-items:center;gap:12px;background:#2a1748;border:3px solid var(--ink);margin:6px auto;padding:6px 12px;width:min(660px,94vw)}
.rk .pl{font-family:'Press Start 2P';font-size:18px;width:46px;color:var(--gold)}
.rk>img{width:48px;height:48px}
.plist{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.plist .pp{background:#2a1748;border:3px solid var(--ink);padding:8px 10px;min-width:150px;text-align:center}
.pp .px{font-size:9px}
.ok{color:#2ed16b}.wait{color:#ffd23f}
</style>
</head>
<body>
<canvas id="c3d"></canvas>
<div id="scr"></div>
<div id="hud" class="hidden"></div>
<div id="rbar" class="hidden"></div>
<div id="msg" class="hidden"></div>
<div id="dice" class="hidden">?</div>
<div id="diceTip" class="hidden"></div>
<div id="pad" class="hidden"><button id="padB">¡ACCIÓN!<br><br>ESPACIO</button></div>
<div id="modal" class="hidden"></div>
<div id="dlg" class="hidden"><img id="dlgFace" alt=""><div style="flex:1"><div id="dlgName">TIMO</div><div id="dlgText"></div></div><div id="dlgNext">▼</div><button id="dlgSkip" class="btn sm alt">SALTAR ⏭</button></div>
<div id="netb" class="hidden"></div>
<div id="tools"><button class="btn sm alt" id="bFast" title="Acelerar turnos">⏩ x1</button><button class="btn sm alt" id="bMute">♪ ON</button></div>

<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';

const SHAPES=[a=>{const r=1+.13*Math.sin(3*a+.6)+.06*Math.cos(5*a);return[1.4*r,r]},                       // 2D: forma orgánica, como trazo a mano
  a=>{const r=Math.pow(Math.pow(Math.abs(Math.cos(a)),4)+Math.pow(Math.abs(Math.sin(a)),4),-.25);return[1.45*r,r]},// Live action: rectángulo redondeado (pantalla)

  a=>{const r=1-.28*Math.cos(4*a);return[1.25*r,r]},                                                          // Videojuegos: trébol de 4 hojas
  a=>{const r=1+.16*Math.cos(8*a);return[1.15*r,r]}];                                                         // VFX: estallido de 8 puntas

  const sc=N*2.75/L,out=[];let j=0;for(let n=0;n<N;n++){const tgt=n*L/N;while(cum[j+1]<tgt)j++;const p=pts[j];out.push(V3(p[0]*sc,0,p[1]*sc))}return out}

const HELD=[0],PC=[0];let waiters=[];
function pdown(){audio();if(!HELD[0])PC[0]++;HELD[0]=1;$('#padB').classList.add('on');const w=waiters;waiters=[];w.forEach(f=>f())}
function pup(){HELD[0]=0;$('#padB').classList.remove('on')}
addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='KeyA')&&!e.repeat&&!(e.target&&e.target.tagName==='INPUT')){e.preventDefault();pdown()}});
addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='KeyA')pup()});addEventListener('blur',pup);
function onPress(){return new Promise(r=>waiters.push(r))}
function rankFrom(sc){return sc.map((v,i)=>({i,v,r:R()})).sort((a,b)=>b.v-a.v||a.r-b.r).map(o=>o.i)}
function fmtScore(mech,v){if(v<=-1e8)return'sin resultado';if(mech==='reaction')return(-v).toFixed(2)+' s';if(mech==='jump'||mech==='flip')return(-v)+' choques';if(mech==='mash'||mech==='redlight')return v>=900?'¡Meta!':Math.round(v-22)+' px';if(mech==='balance')return v.toFixed(1)+' s';if(mech==='stack')return(Math.floor(v/100)-1)+' pisos';if(mech==='count')return(-v)+' de error';return Math.round(v)+' pts'}
function runMG(def,cv,mode,o={}){
  const g=cv.getContext('2d');const M=MECH[def.mech],th=THEMES[def.theme];let P,s,phase,cd,endT,last,stopped=false,resolve,localN=0;
  function reset(){const seed=o.seed||1;P=S.pl.map((pl,i)=>{let kind='bot';if(CON.on){if(mode!=='preview'&&!pl.b)kind='remote'}else if(mode!=='preview'&&i===NET.mySlot)kind='local';else if(mode==='real'&&!pl.b)kind='remote';
      const mood=(mulberry(seed+i*31)()-.5)*.3;return{i,kind,snd:kind==='local'||(CON.on&&kind==='remote'),c:pl.c,col:PCOL[i],skill:clamp((pl.b?pl.sk:.55)+mood,.05,.98),prev:false,lastN:null}});
    s={t:0,sp:def.sp,thi:def.theme,done:false,R:mulberry(seed),L:P.map((p,i)=>mulberry(seed*7+i*131)),loud:mode!=='preview'};M.init(s,P);phase='count';cd=mode==='preview'?1:3;endT=0;PC[0]=0;localN=0}
  reset();last=performance.now();
  function inputFor(p,dt,first){if(p.snd){const n=first?PC[0]:0;if(first)PC[0]=0;const h=!!HELD[0];if(phase==='play'){localN+=n;if(mode==='real'&&o.run)netInput({r:o.run,h:h?1:0,n:localN})}return{n:phase==='play'?n:0,h}}
    if(p.kind==='remote'&&CON.on){const ci=CON.inp[p.i];if(p.base==null)p.base=ci.n;const n=ci.n-p.base;p.base=ci.n;return{n:phase==='play'?n:0,h:!!ci.h}}
    if(p.kind==='remote'){const ri=NET.inp[p.i];if(!ri||ri.r!==o.run)return{n:0,h:false};if(p.lastN==null)p.lastN=0;const n=Math.max(0,ri.n-p.lastN);p.lastN=ri.n;return{n:phase==='play'?n:0,h:!!ri.h}}
    const h=phase==='play'?!!M.bot(s,p,dt):false;const n=h&&!p.prev?1:0;p.prev=h;return{n,h}}
  let lastCall=performance.now(),wd=null;
  function step(dt,first){const I=P.map(p=>inputFor(p,dt,first));
    if(phase==='count'){const c0=Math.ceil(cd);cd-=dt;if(Math.ceil(cd)!==c0&&cd>0&&mode!=='preview')SFX.blip();if(cd<=0){phase='play';if(mode!=='preview')SFX.go()}}
    else if(phase==='play'){s.t+=dt;M.update(s,P,dt,I);if(s.done||s.t>=M.dur){phase='end';if(mode!=='preview')SFX.fan()}}
    else{endT+=dt;if(endT>1.6){if(mode==='preview')reset();else{stopped=true;clearInterval(wd);draw();resolve(M.score(s,P));return true}}}return false}
  function frame(now){if(stopped)return;lastCall=performance.now();let el=Math.min(3,Math.max(0,(now-last)/1000));last=now;let first=true;

    const rem=Math.max(0,M.dur-s.t);px(g,232,7,84,6,'#1a1020');px(g,232.5,7.5,83*rem/M.dur,5,rem<5?'#ff4d4d':'#ffd84a');
    if(mode==='practice')txt(g,'PRÁCTICA',228,8,'#46e0ff',4,'right');if(mode==='preview')txt(g,'DEMO',228,8,'#ff4fa3',4,'right');
    if(phase==='count'&&mode!=='preview'){blk(g,118,66,84,48,'#2a0f3a');txt(g,cd>0?''+Math.ceil(cd):'',160,78,'#ffd84a',24,'center')}
    if(phase==='play'&&s.t<.6&&mode!=='preview')txt(g,'¡YA!',160,78,'#ffd84a',24,'center');
    if(phase==='end'){blk(g,60,72,200,36,'#2a0f3a');txt(g,mode==='practice'?'¡FIN DE PRÁCTICA!':'¡SE ACABÓ!',160,86,'#ffd84a',8,'center')}}
  const prom=new Promise(r=>resolve=r);requestAnimationFrame(frame);return{prom,stop(){stopped=true;clearInterval(wd)}}}
function thumb(def){const cv=document.createElement('canvas');cv.width=640;cv.height=360;const g=cv.getContext('2d');g.setTransform(2,0,0,2,0,0);g.imageSmoothingEnabled=false;const M=MECH[def.mech],th=THEMES[def.theme];
  const P=S.pl.map((pl,i)=>({i,kind:'bot',c:pl.c,col:PCOL[i],skill:.5}));const s={t:0,sp:def.sp,thi:def.theme,R:mulberry(7),L:P.map((p,i)=>mulberry(9+i))};M.init(s,P);g.fillStyle=th.bg;g.fillRect(0,0,320,180);try{M.draw(g,s,P,th)}catch(e){}return cv}
/* ===================== RED: SALAS CON CÓDIGO ===================== */
// Usa la capacidad "room" de Claude: el anfitrión publica el estado S en su presencia;
// los invitados publican sus acciones (acts) y sus pulsaciones (inp). Nada pasa por servidores externos.
const NET={room:null,r:null,role:'solo',me:null,mySlot:0,inp:[],code:'',ready:false};
const isHost=()=>NET.role!=='guest';
async function netInit(){try{if(window.claude&&typeof window.claude.use==='function'){NET.room=await window.claude.use('room')}}catch(e){NET.room=null}NET.ready=true;menuNet()}
function utf8len(s){try{return new TextEncoder().encode(s).length}catch(e){return s.length*2}}
let pubQ=false;
function pub(){if(CON.on)conBroadcast();if(NET.role==='host'&&NET.r){let str=JSON.stringify(S);if(utf8len(str)>3700&&S.dlg){S.dlg.t=S.dlg.t.slice(0,200);str=JSON.stringify(S)}NET.r.presence({role:'host',S:JSON.parse(str)}).catch(()=>{})}scheduleState()}
function scheduleState(){if(pubQ)return;pubQ=true;requestAnimationFrame(()=>{pubQ=false;try{renderState()}catch(e){console.error(e)}})}
function netInput(o){if(NET.r&&NET.role!=='solo')NET.r.presence({inp:o}).catch(()=>{})}
function act(k,v){audio();if(isHost())handleAct(NET.role==='console'?0:NET.mySlot,{k,v});else{G.acts.push({q:++G.seq,k,v:v===undefined?null:v});G.acts=G.acts.slice(-8);NET.r&&NET.r.presence({acts:G.acts}).catch(()=>{})}}
const genCode=()=>Array.from({length:5},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(R()*32)]).join('');
const cleanName=s=>String(s||'').replace(/[^\p{L}\p{N} ._-]/gu,'').trim().slice(0,12);
async function hostRoom(){NET.role='host';NET.code=genCode();NET.r=await NET.room.join('cp-'+NET.code.toLowerCase());
  NET.r.onPeers(()=>hostPeers(),()=>{});await NET.r.presence({role:'host',S:null});}
function hostPeers(){if(!S)return;const peers=NET.r.peers();let ch=false;
  for(const pr of peers){if(pr.sameTab){if(NET.me!==pr.peer){NET.me=pr.peer;S.pl[0].pe=pr.peer;ch=true}continue}
    const pre=pr.presence||{};if(pre.role!=='guest')continue;let slot=S.pl.findIndex(p=>p.pe===pr.peer);
    if(slot<0&&S.ph==='lobby'){slot=S.pl.findIndex((p,i)=>i>0&&!p.pe);if(slot>0){Object.assign(S.pl[slot],{pe:pr.peer,n:cleanName(pre.name)||('Jugador '+(slot+1)),b:0,lv:''});G.lastSeq[slot]=0;fx('sel');ch=true}}
    if(slot<0)continue;
    if(S.ph==='lobby'&&pre.name&&cleanName(pre.name)!==S.pl[slot].n){S.pl[slot].n=cleanName(pre.name);ch=true}
    NET.inp[slot]=pre.inp||null;
    (pre.acts||[]).forEach(a=>{if(a&&a.q>(G.lastSeq[slot]||0)){G.lastSeq[slot]=a.q;handleAct(slot,{k:a.k,v:a.v})}})}
  S.pl.forEach((p,i)=>{if(i>0&&p.pe&&!peers.some(q=>q.peer===p.pe)){dropSlot(i);ch=true}});
  if(ch)pub()}
async function guestRoom(code,name){NET.role='guest';G.acts=[];G.seq=0;NET.code=code;NET.r=await NET.room.join('cp-'+code.toLowerCase());
  await NET.r.presence({role:'guest',name,acts:[],inp:null});NET.r.onPeers(()=>guestPeers(),()=>{});G.joinT=Date.now()}
function guestPeers(){const peers=NET.r.peers();const me=peers.find(p=>p.sameTab);if(me)NET.me=me.peer;
  const host=peers.find(p=>p.presence&&p.presence.role==='host'&&p.presence.S);
  if(!host){if(G.hadHost){G.hadHost=false;hostGone()}return}
  G.hadHost=true;const hs=host.presence.S;
  if(hs!==G.lastHS){G.lastHS=hs;S=hs;NET.mySlot=S.pl.findIndex(p=>p.pe===NET.me);if(NET.mySlot<0&&S.ph!=='lobby'){fullRoom();return}scheduleState()}
  for(const pr of peers){const pre=pr.presence||{};const slot=pr.peer===host.peer?0:S.pl.findIndex(p=>p.pe===pr.peer);if(slot>=0)NET.inp[slot]=pre.inp||null}}
function hostGone(){leaveRoom();toMenu('El anfitrión cerró la sala o perdió la conexión.')}
function fullRoom(){leaveRoom();toMenu('Esa sala ya está llena o la partida ya empezó.')}
function leaveRoom(){try{NET.r&&NET.r.leave()}catch(e){}NET.r=null;NET.role='solo';NET.mySlot=0;S=null;G.lastHS=null}

// Conexión directa celular↔PC por WebRTC (viaja por la misma red wifi). La función de Netlify cp-signal solo sirve
// para el "apretón de manos" inicial (intercambio de ofertas/respuestas), usando el Firebase de ANIMAPP.
const CON={on:false,code:'',peers:{},slotOf:{},inp:[0,1,2,3,4].map(()=>({h:0,n:0})),lastS:'',handled:{},pollT:null,dropped:new Set()};
const ICE={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]};
function cpRoot(){let b;try{b=new URL(document.baseURI)}catch(e){return null}if(!/^https?:$/.test(b.protocol))return null;const p=b.pathname.includes('/exp/')?b.pathname.split('/exp/')[0]+'/':b.pathname.replace(/[^/]*$/,'');return b.origin+p}
const CP_ROOT=cpRoot();const SIG=CP_ROOT?new URL('/.netlify/functions/cp-signal',CP_ROOT).href:null;
async function sig(body){const r=await fetch(SIG,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
async function sigGet(q){const r=await fetch(SIG+'?'+new URLSearchParams(q),{cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
function iceDone(pc,ms=2500){return new Promise(r=>{if(pc.iceGatheringState==='complete')return r();const t=setTimeout(r,ms);pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(t);r()}})})}
const genCode6=()=>Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(R()*32)]).join('');
async function conOpen(){CON.code=genCode6();await sig({op:'open',code:CON.code});CON.on=true;NET.code=CON.code;conPoll()}
async function conPoll(){clearTimeout(CON.pollT);if(!CON.on)return;try{const j=await sigGet({op:'offers',code:CON.code});for(const o of j.offers||[]){const k=o.pid+':'+o.t;if(CON.handled[k])continue;CON.handled[k]=1;conAccept(o).catch(e=>console.warn(e))}}catch(e){console.warn('señalización',e)}
  CON.pollT=setTimeout(conPoll,S&&S.ph==='lobby'?1200:2500)}
function freeSlotFor(pid){if(CON.slotOf[pid]!=null)return CON.slotOf[pid];
  if(S.ph==='lobby'){const taken=new Set(Object.values(CON.slotOf));const i=S.pl.findIndex((p,k)=>!p.b&&!p.pe&&!taken.has(k));return i>=0?i:null}
  for(const i of CON.dropped){if(!Object.values(CON.peers).some(q=>q.slot===i&&q.ch&&q.pid!==pid))return i}return null}
async function conAccept(o){const pid=String(o.pid);const slot=freeSlotFor(pid);
  if(slot==null){await sig({op:'answer',code:CON.code,pid,err:'full'});return}CON.slotOf[pid]=slot;
  const old=CON.peers[pid];if(old){try{old.pc.close()}catch(e){}}
  const pc=new RTCPeerConnection(ICE);const peer={pc,slot,ch:null,name:cleanName(o.name)||('Jugador '+(slot+1)),pid};CON.peers[pid]=peer;CON.slotOf[pid]=slot;
  pc.ondatachannel=e=>conWire(e.channel,peer);
  pc.onconnectionstatechange=()=>{if(['failed','closed','disconnected'].includes(pc.connectionState))conLost(peer)};
  await pc.setRemoteDescription({type:'offer',sdp:o.offer});const ans=await pc.createAnswer();await pc.setLocalDescription(ans);await iceDone(pc);
  await sig({op:'answer',code:CON.code,pid,slot,sdp:pc.localDescription.sdp})}
function conWire(ch,peer){const slot=peer.slot;
  ch.onopen=()=>{peer.ch=ch;clearTimeout(peer.lostT);const p=S.pl[slot];if(S.ph==='lobby'||CON.dropped.has(slot)){p.n=peer.name;p.b=0;p.lv=''}p.pe=peer.pid;CON.dropped.delete(slot);fx('sel');CON.lastS='';pub()};
  ch.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}const ci=CON.inp[slot];
    if(m.t==='d'){if(!ci.h)ci.n++;ci.h=1}else if(m.t==='u'){ci.h=0}
    else if(m.t==='a'&&typeof m.k==='string')handleAct(slot,{k:m.k,v:m.v});
    else if(m.t==='n'&&S.ph==='lobby'){S.pl[slot].n=peer.name=cleanName(m.v)||S.pl[slot].n;pub()}};
  ch.onclose=()=>conLost(peer)}
function conLost(peer){if(peer.gone)return;peer.ch=null;CON.inp[peer.slot].h=0;clearTimeout(peer.lostT);
  peer.lostT=setTimeout(()=>{if(peer.ch||CON.peers[peer.pid]!==peer)return;peer.gone=true;const i=peer.slot;if(!S)return;
    if(S.ph==='lobby'){S.pl[i].pe=null;S.pl[i].n='';delete CON.slotOf[peer.pid];pub();return}
    CON.dropped.add(i);S.pl[i].pe=null;dropSlot(i);pub()},S&&S.ph==='lobby'?4000:15000)}
function conBroadcast(){if(!CON.on||!S)return;const st=JSON.stringify({t:'s',S});if(st===CON.lastS)return;CON.lastS=st;Object.values(CON.peers).forEach(p=>{if(p.ch&&p.ch.readyState==='open')try{p.ch.send(st)}catch(e){}})}
function conSend(slot,obj){Object.values(CON.peers).forEach(p=>{if(p.slot===slot&&p.ch&&p.ch.readyState==='open')try{p.ch.send(JSON.stringify(obj))}catch(e){}})}

function handleAct(slot,a){if(!S)return;const v=a.v;

function startSolo(n){NET.role='solo';NET.mySlot=0;S=newS();Object.assign(S.pl[0],{n,b:0});SFX.fan();hostFlow(true).catch(e=>console.error(e))}
async function startHost(n){await hostRoom();NET.mySlot=0;S=newS();Object.assign(S.pl[0],{n,b:0,pe:NET.me});G.flag.next=false;setPh('lobby');hostPeers();SFX.fan();
  say([['timo',`¡Sala ${NET.code} abierta! Compartan el código con sus compañeros.`],['maya','Cuando estén todos, el anfitrión presiona COMENZAR.']],{auto:5000});
  await waitFor(()=>G.flag.next);S.pl.forEach((p,i)=>{if(!p.pe&&i>0)p.b=1});hostFlow(true).catch(e=>console.error(e))}
function joinScreen(n){screen(`<div class="panel" style="text-align:center;max-width:560px"><h2>UNIRME A UNA SALA</h2><p>Escribe el código que te compartió el Jugador 1:</p><p><input class="tx code" id="cd" maxlength="5" placeholder="ABCDE"></p><div class="row"><button class="btn pink" id="go">ENTRAR ▶</button><button class="btn alt" id="bk">◀ VOLVER</button></div><div id="jn" class="small"></div></div>`);
  $('#cd').focus();$('#bk').onclick=()=>toMenu();
  const go=async()=>{const code=$('#cd').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==5){$('#jn').textContent='El código tiene 5 caracteres.';SFX.bad();return}
    $('#jn').textContent='Conectando a la sala '+code+'…';$('#go').disabled=true;
    try{G.hadHost=false;await guestRoom(code,n)}catch(e){leaveRoom();toMenu('No se pudo entrar a la sala.');return}
    setTimeout(()=>{if(NET.role==='guest'&&!G.hadHost){leaveRoom();toMenu('No encontramos la sala '+code+'. Revisa el código o pide al anfitrión que la vuelva a abrir.')}},10000)};
  $('#go').onclick=go;$('#cd').onkeydown=e=>{if(e.code==='Enter')go()}}
window.__cpS=()=>S;
(async()=>{try{await document.fonts.ready}catch(e){}
  if(!window.THREE){screen('<div class="panel">No se pudo cargar el motor 3D (Three.js). Revisa tu conexión y recarga.</div>');return}
  initRenderer();buildSprites();buildPortraits();buildStage();buildWard();buildBsel();if(window.CP_CONSOLE){toConsoleMenu();phoneNotice()}else{toMenu();netInit()}})();

</script>
